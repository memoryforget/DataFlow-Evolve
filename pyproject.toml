[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-evolve"
version = "0.1.0"
description = "DataFlow-Evolve as a Claude Code / Codex plugin (MCP server + skills + bundled runtime)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2,<3",
    "pandas>=2.2,<4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
multimodal = ["Pillow>=10,<13"]
review = [
    "openai>=1,<3",
    "requests>=2.31,<3",
]
dev = ["pytest>=8", "pytest-asyncio"]

[project.scripts]
dataflow-evolve-mcp = "rsi_mcp.server:serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "rsi_mcp*", "dataflow_evolve*"]
